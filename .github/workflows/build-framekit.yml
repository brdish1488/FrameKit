name: Build FrameKit IPA
'on':
  push:
    branches:
    - main
    paths:
    - ios-app/**
    - AirliftFFI.xcframework/**
    - AirCard-iOS.xcodeproj/**
    - .github/workflows/build-framekit.yml
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS runner (Intel builds IPA; ARM also runs simulator tests)
        required: true
        default: macos-15-intel
        type: choice
        options:
        - macos-15-intel
        - macos-15
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Explain selected build host
      run: 'echo "Runner architecture: $RUNNER_ARCH"

        if [ "$RUNNER_ARCH" != ARM64 ]; then echo "Building arm64 iPhone IPA on Intel. Simulator tests are skipped: the bundled
        simulator framework is ARM64-only."; fi

        '
    - name: Validate FrameKit branding and upstream attribution
      run: 'python3 - <<''PYCODE''

        import plistlib

        from pathlib import Path

        p=plistlib.loads(Path(''ios-app/Info.plist'').read_bytes())

        assert p[''CFBundleDisplayName'']==''FrameKit''

        assert ''FrameKit is a fork of AirCard-iOS'' in Path(''ios-app/ContentView.swift'').read_text()

        assert Path(''LICENSE'').is_file()

        s=Path(''ios-app/ContentView.swift'').read_text()

        tab=s[s.index(''struct PasscodeThemeTab:''):s.index(''// MARK: Apply Theme section'')]

        assert ''TendiesDocumentPickerView { urls in'' in tab

        assert ''.fileImporter('' not in tab

        print(''FrameKit branding, license and shared wallpaper picker verified.'')

        PYCODE

        '
    - name: Compile FrameKit for iPhone (no Apple account required)
      run: "set -euo pipefail\nmkdir -p build\nxcodebuild -version\nxcodebuild -project AirCard-iOS.xcodeproj -scheme AirCard-iOS\
        \ \\\n  -configuration Release -derivedDataPath build/DerivedData \\\n  -destination 'generic/platform=iOS' clean\
        \ build \\\n  PRODUCT_NAME=FrameKit PRODUCT_MODULE_NAME=AirCard_iOS MARKETING_VERSION=1.3.6 CURRENT_PROJECT_VERSION=5\
        \ \\\n  PRODUCT_BUNDLE_IDENTIFIER=com.brdish.framekit \\\n  CODE_SIGN_IDENTITY=\"\" CODE_SIGNING_REQUIRED=NO \\\n\
        \  CODE_SIGN_ENTITLEMENTS=\"\" CODE_SIGNING_ALLOWED=NO \\\n  > build/xcodebuild.log 2>&1 || { tail -n 180 build/xcodebuild.log;\
        \ exit 1; }\ntail -n 12 build/xcodebuild.log\n"
    - name: Run import regression tests (ARM64 simulator only)
      run: "set -euo pipefail\nDEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin);\
        \ print(next(v[\"udid\"] for group in d[\"devices\"].values() for v in group if v[\"name\"].startswith(\"iPhone\"\
        )))')\nxcrun simctl boot \"$DEVICE\" || true\nxcrun simctl bootstatus \"$DEVICE\" -b\nxcodebuild test -project AirCard-iOS.xcodeproj\
        \ -scheme AirCard-iOS \\\n  -configuration Debug -derivedDataPath build/TestDerivedData \\\n  -destination \"platform=iOS\
        \ Simulator,id=$DEVICE\" \\\n  -only-testing:AirCard-iOSTests/PasscodeThemeImportTests \\\n  -resultBundlePath build/ThemeImportTests.xcresult\
        \ \\\n  CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \\\n  > build/import-tests.log 2>&1 || { tail -n 180 build/import-tests.log;\
        \ exit 1; }\ntail -n 35 build/import-tests.log\n"
      if: runner.arch == 'ARM64'
    - name: Package and verify IPA
      run: 'set -euo pipefail

        APP="$(find build/DerivedData/Build/Products -name FrameKit.app -type d | head -1)"

        test -n "$APP"

        mkdir -p build/Payload

        cp -R "$APP" build/Payload/FrameKit.app

        rm -rf build/Payload/FrameKit.app/_CodeSignature

        rm -f build/Payload/FrameKit.app/embedded.mobileprovision

        cp LICENSE build/Payload/FrameKit.app/UPSTREAM-LICENSE.txt

        plutil -lint build/Payload/FrameKit.app/Info.plist

        /usr/libexec/PlistBuddy -c ''Print :CFBundleDisplayName'' build/Payload/FrameKit.app/Info.plist | grep -x FrameKit

        codesign --force --sign - build/Payload/FrameKit.app

        codesign --verify --deep --verbose build/Payload/FrameKit.app

        (cd build && zip -qr FrameKit.ipa Payload)

        unzip -t build/FrameKit.ipa

        '
    - uses: actions/upload-artifact@v4
      with:
        name: FrameKit-IPA
        path: build/FrameKit.ipa
        if-no-files-found: error
        retention-days: 3
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: FrameKit-build-log
        path: 'build/xcodebuild.log

          build/import-tests.log

          build/ThemeImportTests.xcresult'
        retention-days: 3
concurrency:
  group: framekit-${{ github.ref }}
  cancel-in-progress: true
